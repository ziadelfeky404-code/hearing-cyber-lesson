<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إشارة</title>
<style>@font-face{font-family:Ishara;src:url('assets/ishara.ttf')}*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#173b40;font-family:Ishara,Tahoma,Arial;font-size:13px}header{padding:12px 22px;background:#2b6b74;color:white;font:14px Ishara,Tahoma,Arial}main{max-width:1100px;margin:20px auto;padding:0 14px}.btn{background:#2b6b74;color:white;padding:8px 12px;border:0;border-radius:9px;cursor:pointer;display:inline-block;margin:4px;font:12px Ishara,Tahoma,Arial}input[type=file]{display:none}.grid{display:grid;grid-template-columns:1fr;gap:14px}.panel{background:white;border:1px solid #d7e1e3;border-radius:14px;padding:14px}video{width:100%;max-height:65vh;background:#111}.sign{min-height:200px;aspect-ratio:1.5/1;border:2px solid #2b6b74;border-radius:12px;background:#f8fbfc;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font:48px/1.5 Ishara,Tahoma;overflow-wrap:anywhere}.caption{font:16px/1.8 Ishara,Tahoma,Arial;margin-top:12px;min-height:50px}textarea{width:100%;min-height:110px;padding:10px;font:12px Ishara,Tahoma,Arial}.note{font:11px/1.7 Ishara,Tahoma,Arial;color:#52666a}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style>
<header><b>إشارة — عرض إشارات متزامن مع الفيديو</b></header><main>
<label class="btn" for="vf">اختيار فيديو</label><input id="vf" type="file" accept="video/*"><button class="btn" id="fontToggle" type="button">التبديل إلى الخط العادي</button><label class="btn" for="pageSize">حجم واجهة الموقع</label><input id="pageSize" type="range" min="10" max="18" value="13" style="width:110px;vertical-align:middle">
<label class="btn" for="sf">تحميل ملف ترجمة SRT</label><input id="sf" type="file" accept=".srt,.vtt,.txt">
<button class="btn" id="paste">تجهيز النص</button>
<div class="grid"><section class="panel"><video id="v" controls></video><div class="sign" id="sign">حمّل فيديو وملف ترجمة</div><div class="caption" id="cap">النص المتزامن سيظهر هنا</div><label class="note">حجم فونت الإشارة <input id="sz" type="range" min="24" max="110" value="48"></label><p id="status" class="note">جاهز. هذه النسخة تعرض النص بالخط؛ ليست ترجمة آلية من الصوت.</p></section></div>
<section class="panel" style="margin-top:14px"><b>نص الترجمة / التفريغ</b><textarea id="txt" placeholder="الصق التفريغ هنا. للمزامنة الدقيقة استخدم SRT بتوقيتات."></textarea><p class="note">لفيديو يوتيوب: استخدم «إظهار النص» وانسخ النص هنا. التوقيت الدقيق يحتاج ملف SRT.</p></section></main>
<script>
const v=document.querySelector('#v'),s=document.querySelector('#sign'),c=document.querySelector('#cap'),txt=document.querySelector('#txt'),status=document.querySelector('#status');let cues=[],signFont=true;
document.querySelector('#vf').onchange=e=>{let f=e.target.files[0];if(f)v.src=URL.createObjectURL(f)};
function sec(x){let a=x.trim().replace(',','.').split(':');return (+a[0])*3600+(+a[1])*60+(+a[2])}
function parse(t){return t.replace(/\r/g,'').trim().split(/\n\s*\n/).flatMap(b=>{let l=b.split('\n'),i=l.findIndex(x=>x.includes('-->'));if(i<0)return[];let q=l[i].split('-->');return[{start:sec(q[0]),end:sec(q[1]),text:l.slice(i+1).join(' ').replace(/<[^>]*>/g,'').trim()}]})}
function load(){let t=txt.value.trim();if(t.includes('-->'))cues=parse(t);else cues=t.split(/\n+/).filter(Boolean).map((text,i)=>({start:i*3,end:(i+1)*3,text}));status.textContent=`تم تجهيز ${cues.length} مقطع. ${t.includes('-->')?'بتوقيت SRT':'بدون توقيت؛ 3 ثوانٍ لكل سطر مؤقتًا'}`;update()}
document.querySelector('#sf').onchange=async e=>{txt.value=await e.target.files[0].text();load()};document.querySelector('#paste').onclick=load;document.querySelector('#sz').oninput=e=>s.style.fontSize=e.target.value+'px';document.querySelector('#pageSize').oninput=e=>document.body.style.fontSize=e.target.value+'px';document.querySelector('#fontToggle').onclick=()=>{signFont=!signFont;document.body.style.fontFamily=signFont?'Ishara,Tahoma,Arial':'Tahoma,Arial,sans-serif';document.querySelectorAll('.btn').forEach(x=>x.style.fontFamily=signFont?'Ishara,Tahoma,Arial':'Tahoma,Arial,sans-serif');document.querySelector('#fontToggle').textContent=signFont?'التبديل إلى الخط العادي':'التبديل إلى فونت الإشارة';};v.ontimeupdate=update;
function update(){if(!cues.length)return;let t=v.currentTime,q=cues.find(x=>x.start<=t&&t<x.end);if(q){c.textContent=q.text;s.textContent=q.text}else if(v.paused){c.textContent='';s.textContent='—'}}
</script>
